[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "utamo-rfid-lab"
version = "3.2.0"
description = "Local authenticated RFID/MIFARE dump analysis and controlled Proxmark3 integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "pyserial>=3.5,<4",
  "reportlab>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["S110", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108"]

[tool.setuptools.packages.find]
include = ["app*"]
